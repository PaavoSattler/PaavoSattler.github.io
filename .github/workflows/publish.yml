name: Publish Quarto Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

           - name: Fix sitemap namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("_site/sitemap.xml")
          text = path.read_text(encoding="utf-8")

          namespace = 'xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"'

          if namespace not in text:
              text = text.replace(
                  "<urlset",
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"',
                  1
              )
              path.write_text(text, encoding="utf-8")

          if namespace not in path.read_text(encoding="utf-8"):
              raise RuntimeError("Sitemap namespace could not be added")

          print(path.read_text(encoding="utf-8")[:300])
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4